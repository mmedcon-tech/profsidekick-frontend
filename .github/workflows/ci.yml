name: Frontend CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

jobs:
  build-and-test:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_IS_LOCAL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
